name: Build Shop APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleCustomerDebug assembleAdminDebug
      - run: |
          cp android/app/build/outputs/apk/customer/debug/*.apk BECHIR-SHOP.apk
          cp android/app/build/outputs/apk/admin/debug/*.apk BECHIR-SHOP-PRO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BECHIR-SHOP-APKs
          path: '*.apk'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view shop-apks || gh release create shop-apks --title "Bechir Shop APKs" --notes "Android test builds"
          gh release upload shop-apks BECHIR-SHOP.apk BECHIR-SHOP-PRO.apk --clobber
