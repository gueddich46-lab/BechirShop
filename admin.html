<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة بشير شوب</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6fc;color:#28163f;font:16px system-ui}main{max-width:650px;margin:auto;padding:16px}header img{width:100%;display:block}section,article{background:white;padding:16px;border-radius:18px;margin:12px 0}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ddd;margin:5px 0}input,select{width:100%}button{background:#6735ba;color:white;border:0;cursor:pointer}article img{width:90px;height:90px;object-fit:contain}button:disabled{opacity:.5}a{color:#6735ba}</style><header><img src="logo.png" alt="بشير شوب"></header><main><a href="index.html">العودة للمتجر</a><h2>لوحة الإدارة</h2><p id="msg" role="status"></p><section id="login"><form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button>دخول</button></form></section><div id="panel" hidden><button id="logout">تسجيل الخروج</button><section><h3 id="heading">إضافة منتج</h3><form id="productForm"><input id="name" placeholder="اسم المنتج" required><input id="brand" placeholder="الماركة"><input id="size" placeholder="القياس"><select id="category"><option>ملابس</option><option>أحذية</option></select><select id="audience"><option>الكل</option><option>رجالية</option><option>نسائية</option><option>أطفال</option></select><input id="price" type="number" min=".001" step=".001" placeholder="السعر بالدينار" required><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><button id="save">حفظ المنتج</button><button type="button" id="cancel">إلغاء التعديل</button></form></section><section><h3>طلبات الحرفاء</h3><button id="refreshOrders">تحديث الطلبات</button><div id="orders"></div></section><h3>المنتجات المنشورة</h3><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://xbytbewdpooyknrkqsxo.supabase.co","sb_publishable_2XntTPhT_hWXjxOL9dIQeA_KXkppU4G");const e=id=>document.getElementById(id);let editing=null;const msg=t=>e('msg').textContent=t;async function check(){const {data}=await db.auth.getSession();let ok=false;if(data.session){const r=await db.rpc('is_shop_admin');ok=r.data===true;if(!ok){await db.auth.signOut();msg('هذا الحساب غير مخول للإدارة')}}e('login').hidden=ok;e('panel').hidden=!ok;if(ok){await load();await loadOrders()}}e('loginForm').onsubmit=async ev=>{ev.preventDefault();const r=await db.auth.signInWithPassword({email:e('email').value,password:e('password').value});e('password').value='';if(r.error){msg('تعذر تسجيل الدخول: تحقق من بياناتك');return}msg('');await check()};e('logout').onclick=async()=>{await db.auth.signOut();location.reload()};function reset(){editing=null;e('productForm').reset();e('heading').textContent='إضافة منتج'}e('cancel').onclick=reset;async function load(){const r=await db.from('products').select('*').order('created_at',{ascending:false});if(r.error){msg(r.error.message);return}e('list').replaceChildren();for(const p of r.data){const a=document.createElement('article'),img=document.createElement('img'),t=document.createElement('p');img.src=p.photo;t.textContent=p.name+' — '+p.price+' د.ت — '+(p.available?'متوفر':'تم البيع');a.append(img,t);for(const [label,fn] of [['تعديل',()=>{editing=p;for(const k of ['name','brand','size','category','audience','price'])e(k).value=p[k];e('heading').textContent='تعديل المنتج';window.scrollTo(0,0)}],[p.available?'تم البيع':'إعادة العرض',async()=>{const r=await db.from('products').update({available:!p.available}).eq('id',p.id);if(r.error)msg(r.error.message);else await load()}],['حذف',async()=>{if(!confirm('حذف المنتج؟'))return;const r=await db.from('products').delete().eq('id',p.id);if(r.error)msg(r.error.message);else await load()}]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;a.append(b)}e('list').append(a)}}e('productForm').onsubmit=async ev=>{ev.preventDefault();e('save').disabled=true;try{let photo=editing?.photo;const file=e('photo').files[0];if(file){if(file.size>5242880)throw Error('الصورة أكبر من 5 ميغابايت');const path=crypto.randomUUID();const r=await db.storage.from('product-photos').upload(path,file,{contentType:file.type});if(r.error)throw r.error;photo=db.storage.from('product-photos').getPublicUrl(path).data.publicUrl}if(!photo)throw Error('اختر صورة');const p={photo};for(const k of ['name','brand','size','category','audience'])p[k]=e(k).value;p.price=Number(e('price').value);const r=editing?await db.from('products').update(p).eq('id',editing.id):await db.from('products').insert(p);if(r.error)throw r.error;reset();msg('تم حفظ المنتج في السحابة');await load()}catch(err){msg(err.message)}finally{e('save').disabled=false}};const statuses={pending:'قيد الانتظار',confirmed:'مؤكد',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'ملغى'};async function loadOrders(){const r=await db.from('orders').select('*').order('created_at',{ascending:false});const list=e('orders');list.replaceChildren();if(r.error){list.textContent='تعذر تحميل الطلبات';return}if(!r.data.length)list.textContent='لا توجد طلبات حالياً';for(const o of r.data){const card=document.createElement('article');for(const value of [o.customer_name,o.phone,o.governorate,o.address,new Date(o.created_at).toLocaleString('ar-TN'),...(Array.isArray(o.items)?o.items.map(i=>i.name+' — '+i.price+' د.ت'):[]),'المجموع: '+Number(o.total||0).toFixed(3)+' د.ت','رقم الطلب: '+o.id]){const p=document.createElement('p');p.textContent=value||'';card.append(p)}const select=document.createElement('select');for(const [k,v] of Object.entries(statuses)){const opt=document.createElement('option');opt.value=k;opt.textContent=v;select.append(opt)}select.value=o.status;const b=document.createElement('button');b.textContent='حفظ الحالة';b.onclick=async()=>{b.disabled=true;const res=await db.from('orders').update({status:select.value}).eq('id',o.id);msg(res.error?'تعذر تحديث الحالة':'تم تحديث حالة الطلب');b.disabled=false};card.append(select,b);list.append(card)}}e('refreshOrders').onclick=loadOrders;check()</script></html>
