<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة بشير شوب</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6fc;color:#28163f;font:16px system-ui}main{max-width:650px;margin:auto;padding:16px}header img{width:100%;display:block}section,article{background:white;padding:16px;border-radius:18px;margin:12px 0}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ddd;margin:5px 0}input,select{width:100%}button{background:#6735ba;color:white;border:0;cursor:pointer}article img{width:90px;height:90px;object-fit:contain}button:disabled{opacity:.5}a{color:#6735ba}.order-product{display:flex;align-items:center;gap:12px;background:#f5f0fc;padding:10px;border-radius:12px;margin:8px 0}.order-product img{width:72px;height:86px;border-radius:8px;background:white}.call{display:inline-block;background:#6735ba;color:white;padding:12px;border-radius:10px;text-decoration:none;margin:8px 0}.order-card{border:1px solid #e8def5;overflow-wrap:anywhere}.delete-order{background:#b42335;margin-inline-start:8px}.order-total{font-weight:bold;color:#6735ba}.notice{background:#eee5ff;padding:12px;border-radius:12px;color:#5124a0}@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');body{font-family:Tajawal,system-ui,sans-serif;font-size:15px;background:#f6f3fa}header{background:#291344}header img{width:100%;max-height:118px;object-fit:contain}main{padding:12px 16px}h2{font-size:23px;margin:14px 0 8px;font-weight:800}h3{font-size:19px;margin:0 0 12px;font-weight:700}main>a{font-size:13px;text-decoration:none}section,article{padding:14px;border-radius:16px;margin:10px 0}input,select,button{padding:9px 12px;margin:4px 0;font-size:15px;min-height:42px}button{font-weight:700}#logout{font-size:13px;min-height:36px;padding:7px 14px;background:#eee5fa;color:#6735ba}#msg{font-size:14px;margin:8px 0}#msg:empty{display:none}header img{height:84px;max-height:84px;object-fit:contain}#login button{width:100%;min-height:42px}h2{font-size:21px;margin:10px 0 8px}#login{padding:12px}main{padding:10px 14px}</style><header><img src="logo.png" alt="بشير شوب"></header><main><a href="index.html">العودة للمتجر</a><h2>لوحة الإدارة</h2><p id="msg" role="status"></p><section id="login"><form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button>دخول</button></form></section><div id="panel" hidden><button id="logout">تسجيل الخروج</button><section><h3 id="heading">إضافة منتج</h3><form id="productForm"><input id="name" placeholder="اسم المنتج" required><input id="brand" placeholder="الماركة"><input id="size" placeholder="القياس"><select id="category"><option>ملابس</option><option>أحذية</option></select><select id="audience"><option>الكل</option><option>رجالية</option><option>نسائية</option><option>أطفال</option></select><input id="price" type="number" min=".001" step=".001" placeholder="السعر بالدينار" required><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><button id="save">حفظ المنتج</button><button type="button" id="cancel">إلغاء التعديل</button></form></section><section><h3>طلبات الحرفاء</h3><button id="refreshOrders">تحديث الطلبات</button><p id="orderNotice" class="notice" role="status" hidden></p><div id="orders"></div></section><h3>المنتجات المنشورة</h3><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://xbytbewdpooyknrkqsxo.supabase.co","sb_publishable_2XntTPhT_hWXjxOL9dIQeA_KXkppU4G");const e=id=>document.getElementById(id);let editing=null;const msg=t=>e('msg').textContent=t;async function check(){const {data}=await db.auth.getSession();let ok=false;if(data.session){const r=await db.rpc('is_shop_admin');ok=r.data===true;if(!ok){await db.auth.signOut();msg('هذا الحساب غير مخول للإدارة')}}e('login').hidden=ok;e('panel').hidden=!ok;if(ok){await load();await loadOrders()}}e('loginForm').onsubmit=async ev=>{ev.preventDefault();const r=await db.auth.signInWithPassword({email:e('email').value,password:e('password').value});e('password').value='';if(r.error){msg('تعذر تسجيل الدخول: تحقق من بياناتك');return}msg('');await check()};e('logout').onclick=async()=>{await db.auth.signOut();location.reload()};function reset(){editing=null;e('productForm').reset();e('heading').textContent='إضافة منتج'}e('cancel').onclick=reset;async function load(){const r=await db.from('products').select('*').order('created_at',{ascending:false});if(r.error){msg(r.error.message);return}e('list').replaceChildren();for(const p of r.data){const a=document.createElement('article'),img=document.createElement('img'),t=document.createElement('p');img.src=p.photo;t.textContent=p.name+' — '+p.price+' د.ت — '+(p.available?'متوفر':'تم البيع');a.append(img,t);for(const [label,fn] of [['تعديل',()=>{editing=p;for(const k of ['name','brand','size','category','audience','price'])e(k).value=p[k];e('heading').textContent='تعديل المنتج';window.scrollTo(0,0)}],[p.available?'تم البيع':'إعادة العرض',async()=>{const r=await db.from('products').update({available:!p.available}).eq('id',p.id);if(r.error)msg(r.error.message);else await load()}],['حذف',async()=>{if(!confirm('حذف المنتج؟'))return;const r=await db.from('products').delete().eq('id',p.id);if(r.error)msg(r.error.message);else await load()}]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;a.append(b)}e('list').append(a)}}e('productForm').onsubmit=async ev=>{ev.preventDefault();e('save').disabled=true;try{let photo=editing?.photo;const file=e('photo').files[0];if(file){if(file.size>5242880)throw Error('الصورة أكبر من 5 ميغابايت');const path=crypto.randomUUID();const r=await db.storage.from('product-photos').upload(path,file,{contentType:file.type});if(r.error)throw r.error;photo=db.storage.from('product-photos').getPublicUrl(path).data.publicUrl}if(!photo)throw Error('اختر صورة');const p={photo};for(const k of ['name','brand','size','category','audience'])p[k]=e(k).value;p.price=Number(e('price').value);const r=editing?await db.from('products').update(p).eq('id',editing.id):await db.from('products').insert(p);if(r.error)throw r.error;reset();msg('تم حفظ المنتج في السحابة');await load()}catch(err){msg(err.message)}finally{e('save').disabled=false}};const statuses={pending:'قيد الانتظار',confirmed:'مؤكد',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'ملغى'};let seenOrders=null,orderBusy=false;async function loadOrders(){if(orderBusy||e('panel').hidden)return;orderBusy=true;try{const r=await db.from('orders').select('*').order('created_at',{ascending:false});const list=e('orders');if(r.error){e('orderNotice').hidden=false;e('orderNotice').textContent='تعذر تحديث الطلبات';return}const ids=[...new Set(r.data.flatMap(o=>Array.isArray(o.product_ids)?o.product_ids:[]))];const pr=ids.length?await db.from('products').select('id,name,photo,price,size').in('id',ids):{data:[]};const products=new Map((pr.data||[]).map(p=>[p.id,p]));const fresh=seenOrders?r.data.filter(o=>!seenOrders.has(o.id)):[];seenOrders=new Set(r.data.map(o=>o.id));if(fresh.length){e('orderNotice').hidden=false;e('orderNotice').textContent='وصل '+fresh.length+' طلب جديد';}list.replaceChildren();if(!r.data.length)list.textContent='لا توجد طلبات حالياً';for(const o of r.data){const card=document.createElement('article');card.className='order-card';for(const value of [o.customer_name,o.phone,o.governorate,o.address,new Date(o.created_at).toLocaleString('ar-TN'),'المجموع: '+Number(o.total||0).toFixed(3)+' د.ت','رقم الطلب: '+o.id]){const p=document.createElement('p');p.textContent=value||'';card.append(p)}const phone=String(o.phone||'').trim();if(/^[0-9]{8}$/.test(phone)){const call=document.createElement('a');call.className='call';call.href='tel:+216'+phone;call.textContent='☎ الاتصال بالحريف';card.append(call)}const h=document.createElement('h4');h.textContent='المنتجات المطلوبة';card.append(h);for(const id of (o.product_ids||[])){const p=products.get(id),row=document.createElement('div');row.className='order-product';if(p?.photo){const img=document.createElement('img');img.src=p.photo;img.alt=p.name;row.append(img)}const t=document.createElement('span');t.textContent=p?p.name+' — '+Number(p.price).toFixed(3)+' د.ت (السعر الحالي) — القياس: '+(p.size||'—'):'منتج غير متاح للعرض';row.append(t);card.append(row)}const select=document.createElement('select');for(const [k,v] of Object.entries(statuses)){const opt=document.createElement('option');opt.value=k;opt.textContent=v;select.append(opt)}select.value=o.status;const b=document.createElement('button');b.textContent='حفظ الحالة';b.onclick=async()=>{b.disabled=true;const res=await db.from('orders').update({status:select.value}).eq('id',o.id);msg(res.error?'تعذر تحديث الحالة':'تم تحديث حالة الطلب');b.disabled=false};const del=document.createElement('button');del.className='delete-order';del.textContent='حذف الطلبية';del.onclick=async()=>{if(!confirm('هل تريد حذف هذه الطلبية نهائياً؟'))return;del.disabled=true;try{const res=await db.from('orders').delete().eq('id',o.id).select('id');if(res.error||!res.data?.length)throw Error('تعذر حذف الطلبية: تحقق من صلاحيات الإدارة');card.remove();msg('تم حذف الطلبية');await loadOrders()}catch(err){msg(err.message);del.disabled=false}};card.append(select,b,del);list.append(card)}}finally{orderBusy=false}}e('refreshOrders').onclick=loadOrders;setInterval(()=>{if(!document.hidden&&!e('panel').hidden&&!orderBusy){const focused=document.activeElement;if(!e('orders').contains(focused))loadOrders()}},30000);check()</script></html>
