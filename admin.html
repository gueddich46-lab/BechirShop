<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة بشير شوب</title><style>@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#f8f6fc;color:#28163f;font:16px system-ui}main{max-width:650px;margin:auto;padding:16px}header img{width:100%;display:block}section,article{background:white;padding:16px;border-radius:18px;margin:12px 0}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ddd;margin:5px 0}input,select{width:100%}button{background:#6735ba;color:white;border:0;cursor:pointer}article img{width:90px;height:90px;object-fit:contain}button:disabled{opacity:.5}a{color:#6735ba}.order-product{display:flex;align-items:center;gap:12px;background:#f5f0fc;padding:10px;border-radius:12px;margin:8px 0}.order-product img{width:72px;height:86px;border-radius:8px;background:white}.call{display:inline-block;background:#6735ba;color:white;padding:12px;border-radius:10px;text-decoration:none;margin:8px 0}.order-card{border:1px solid #e8def5;overflow-wrap:anywhere}.delete-order{background:#b42335;margin-inline-start:8px}.order-total{font-weight:bold;color:#6735ba}.notice{background:#eee5ff;padding:12px;border-radius:12px;color:#5124a0}body{font-family:Tajawal,system-ui,sans-serif;font-size:15px;background:#f6f3fa}header{background:#291344}header img{width:100%;max-height:118px;object-fit:contain}main{padding:12px 16px}h2{font-size:23px;margin:14px 0 8px;font-weight:800}h3{font-size:19px;margin:0 0 12px;font-weight:700}main>a{font-size:13px;text-decoration:none}section,article{padding:14px;border-radius:16px;margin:10px 0}input,select,button{padding:9px 12px;margin:4px 0;font-size:15px;min-height:42px}button{font-weight:700}#logout{font-size:13px;min-height:36px;padding:7px 14px;background:#eee5fa;color:#6735ba}#msg{font-size:14px;margin:8px 0}#msg:empty{display:none}header img{height:84px;max-height:84px;object-fit:contain}#login button{width:100%;min-height:42px}h2{font-size:21px;margin:10px 0 8px}#login{padding:12px}main{padding:10px 14px}header{padding:0;background:#291344;overflow:hidden}header img{display:block;width:100%;height:auto;max-height:none;aspect-ratio:auto;object-fit:contain}section,#list article{border:1px solid #e9e0f4;box-shadow:0 3px 14px #29134409}select{background:#faf8fd;color:#28163f}button{margin-inline-end:6px}#login button{margin-inline-end:0}.file-picker{display:flex;align-items:center;gap:10px;border:1px dashed #bba3df;border-radius:12px;padding:12px;margin:8px 0;background:#faf7ff;cursor:pointer}.file-picker strong{color:#6735ba;white-space:nowrap}.file-picker span{font-size:12px;overflow-wrap:anywhere;min-width:0}.file-picker input{position:absolute;width:1px;height:1px;opacity:0;padding:0;min-height:0}.file-picker:focus-within{outline:2px solid #6735ba}.form-actions,.product-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.form-actions button,.product-actions button{margin:0;padding:9px 5px}#cancel{background:#eee5fa;color:#6735ba}.product-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.product-actions button:last-child{background:#fff0f2;color:#b42335}.product-actions button:nth-child(2){background:#eee5fa;color:#6735ba}.product-summary{display:flex;align-items:center;gap:14px}.product-summary img{width:94px;height:94px;object-fit:cover;border-radius:12px;background:#f5f0fc}.product-info{flex:1;min-width:0;overflow-wrap:anywhere}.product-info h4{margin:0 0 5px;font-size:17px}.product-price{font-weight:800;color:#6735ba;margin:4px 0}.product-status{font-size:12px;color:#24704d}.product-status.sold{color:#8b5360}#refreshOrders{width:100%;margin:0}#orders{margin-top:10px}#list:empty:after{content:'لا توجد منتجات منشورة';color:#756783}#studio{background:#faf7ff;border:1px solid #e9e0f4;border-radius:14px;padding:12px;margin:10px 0}#studio[hidden]{display:none}.studio-preview{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;font-size:12px}.studio-preview img,.studio-preview canvas{width:100%;height:auto;border-radius:8px;display:block}.studio-control{display:block;margin:12px 0;font-size:13px}#studio input[type=range]{padding:0;min-height:24px;accent-color:#6735ba}#studio button{font-size:13px}.studio-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.studio-tools button{margin:0;background:#eee5fa;color:#6735ba}.studio-control output{float:left;color:#6735ba;font-weight:700}</style><header><img src="banner-pro.png" alt="بشير شوب"></header><main><a href="index.html">العودة للمتجر</a><h2>لوحة الإدارة</h2><p id="msg" role="status"></p><section id="login"><form id="loginForm"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button>دخول</button></form></section><div id="panel" hidden><button id="logout">تسجيل الخروج</button><section><h3 id="heading">إضافة منتج</h3><form id="productForm"><input id="name" placeholder="اسم المنتج" required><input id="brand" placeholder="الماركة"><input id="size" placeholder="القياس"><select id="category"><option>ملابس</option><option>أحذية</option></select><select id="audience"><option>الكل</option><option>رجالية</option><option>نسائية</option><option>أطفال</option></select><input id="price" type="number" min=".001" step=".001" placeholder="السعر بالدينار" required><label class="file-picker"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><strong>＋ اختيار صورة</strong><span id="fileName">لم يتم اختيار صورة</span></label><div id="studio" hidden><h3>استوديو المنتجات</h3><div class="studio-preview"><div>الصورة الأصلية<img id="studioOriginal" alt="الأصل"></div><div>المعاينة المحسنة<canvas id="studioCanvas"></canvas></div></div><label class="studio-control">الإضاءة <output id="lightValue">100%</output><input id="studioLight" type="range" min="90" max="110" value="100"></label><label class="studio-control">التباين <output id="contrastValue">100%</output><input id="studioContrast" type="range" min="95" max="105" value="100"></label><div class="studio-tools"><button type="button" id="studioAuto">تحسين تلقائي خفيف</button><button type="button" id="studioRotate">تدوير 90°</button></div><button type="button" id="studioApply">اعتماد التحسين</button><button type="button" id="studioReset">استعادة الأصل</button><p id="studioStatus" role="status">لن تتغير الصورة المنشورة إلا بعد اعتماد التحسين وحفظ المنتج.</p></div><div class="form-actions"><button id="save">حفظ المنتج</button><button type="button" id="cancel">إلغاء التعديل</button></div></form></section><section><h3>طلبات الحرفاء</h3><button id="refreshOrders">تحديث الطلبات</button><p id="orderNotice" class="notice" role="status" hidden></p><div id="orders"></div></section><h3>المنتجات المنشورة</h3><div id="list"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://xbytbewdpooyknrkqsxo.supabase.co","sb_publishable_2XntTPhT_hWXjxOL9dIQeA_KXkppU4G");const e=id=>document.getElementById(id);let editing=null;const msg=t=>e('msg').textContent=t;async function check(){const {data}=await db.auth.getSession();let ok=false;if(data.session){const r=await db.rpc('is_shop_admin');ok=r.data===true;if(!ok){await db.auth.signOut();msg('هذا الحساب غير مخول للإدارة')}}e('login').hidden=ok;e('panel').hidden=!ok;if(ok){await load();await loadOrders()}}e('loginForm').onsubmit=async ev=>{ev.preventDefault();const r=await db.auth.signInWithPassword({email:e('email').value,password:e('password').value});e('password').value='';if(r.error){msg('تعذر تسجيل الدخول: تحقق من بياناتك');return}msg('');await check()};e('logout').onclick=async()=>{await db.auth.signOut();location.reload()};let studioBlob=null,studioUrl=null,studioVersion=0,studioAngle=0;function clearStudio(){studioAngle=0;studioVersion++;studioBlob=null;if(studioUrl)URL.revokeObjectURL(studioUrl);studioUrl=null;e('studio').hidden=true;e('studioOriginal').removeAttribute('src');e('studioLight').value=100;e('studioContrast').value=100}function drawStudio(){studioBlob=null;studioVersion++;const img=e('studioOriginal'),cv=e('studioCanvas');if(!img.naturalWidth)return;const scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale),swap=studioAngle%180!==0;cv.width=swap?h:w;cv.height=swap?w:h;const ctx=cv.getContext('2d');ctx.translate(cv.width/2,cv.height/2);ctx.rotate(studioAngle*Math.PI/180);e('lightValue').textContent=e('studioLight').value+'%';e('contrastValue').textContent=e('studioContrast').value+'%';ctx.filter='brightness('+e('studioLight').value+'%) contrast('+e('studioContrast').value+'%)';ctx.drawImage(img,-w/2,-h/2,w,h);e('studioStatus').textContent='معاينة فقط — اعتمد التحسين قبل الحفظ'}e('photo').onchange=()=>{clearStudio();const f=e('photo').files[0];e('fileName').textContent=f?.name||'لم يتم اختيار صورة';if(!f)return;studioUrl=URL.createObjectURL(f);e('studioOriginal').onload=()=>{e('studio').hidden=false;drawStudio()};e('studioOriginal').src=studioUrl};e('studioLight').oninput=drawStudio;e('studioContrast').oninput=drawStudio;e('studioAuto').onclick=()=>{const img=e('studioOriginal'),sample=document.createElement('canvas');sample.width=32;sample.height=32;const ctx=sample.getContext('2d');ctx.drawImage(img,0,0,32,32);const pixels=ctx.getImageData(0,0,32,32).data;let sum=0;for(let i=0;i<pixels.length;i+=4)sum+=.2126*pixels[i]+.7152*pixels[i+1]+.0722*pixels[i+2];const mean=sum/1024;e('studioLight').value=mean<100?106:mean>190?96:102;e('studioContrast').value=100;drawStudio()};e('studioRotate').onclick=()=>{studioAngle=(studioAngle+90)%360;drawStudio()};e('studioReset').onclick=()=>{studioAngle=0;e('studioLight').value=100;e('studioContrast').value=100;drawStudio();e('studioStatus').textContent='سيتم استخدام الصورة الأصلية'};e('studioApply').onclick=()=>{const v=++studioVersion;e('studioCanvas').toBlob(b=>{if(v!==studioVersion)return;if(!b){e('studioStatus').textContent='تعذر اعتماد الصورة';return}studioBlob=b;e('studioStatus').textContent='تم اعتماد التحسين — احفظ المنتج لنشره'},'image/jpeg',0.94)};function reset(){clearStudio();e('fileName').textContent='لم يتم اختيار صورة';editing=null;e('productForm').reset();e('heading').textContent='إضافة منتج'}e('cancel').onclick=reset;async function load(){const r=await db.from('products').select('*').order('created_at',{ascending:false});if(r.error){msg(r.error.message);return}e('list').replaceChildren();for(const p of r.data){const a=document.createElement('article'),img=document.createElement('img'),t=document.createElement('p');img.src=p.photo;img.alt=p.name;const summary=document.createElement('div'),info=document.createElement('div'),name=document.createElement('h4'),status=document.createElement('span'),actions=document.createElement('div');summary.className='product-summary';info.className='product-info';actions.className='product-actions';name.textContent=p.name;t.className='product-price';t.textContent=Number(p.price).toFixed(3)+' د.ت';status.className='product-status'+(p.available?'':' sold');status.textContent=p.available?'● متوفر':'● تم البيع';info.append(name,t,status);summary.append(img,info);a.append(summary,actions);for(const [label,fn] of [['تعديل',()=>{editing=p;for(const k of ['name','brand','size','category','audience','price'])e(k).value=p[k];e('heading').textContent='تعديل المنتج';window.scrollTo(0,0)}],[p.available?'تم البيع':'إعادة العرض',async()=>{const r=await db.from('products').update({available:!p.available}).eq('id',p.id);if(r.error)msg(r.error.message);else await load()}],['حذف',async()=>{if(!confirm('حذف المنتج؟'))return;const r=await db.from('products').delete().eq('id',p.id);if(r.error)msg(r.error.message);else await load()}]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.append(b)}e('list').append(a)}}e('productForm').onsubmit=async ev=>{ev.preventDefault();e('save').disabled=true;try{let photo=editing?.photo;const file=studioBlob||e('photo').files[0];if(file){if(file.size>5242880)throw Error('الصورة أكبر من 5 ميغابايت');const path=crypto.randomUUID();const r=await db.storage.from('product-photos').upload(path,file,{contentType:file.type});if(r.error)throw r.error;photo=db.storage.from('product-photos').getPublicUrl(path).data.publicUrl}if(!photo)throw Error('اختر صورة');const p={photo};for(const k of ['name','brand','size','category','audience'])p[k]=e(k).value;p.price=Number(e('price').value);const r=editing?await db.from('products').update(p).eq('id',editing.id):await db.from('products').insert(p);if(r.error)throw r.error;reset();msg('تم حفظ المنتج في السحابة');await load()}catch(err){msg(err.message)}finally{e('save').disabled=false}};const statuses={pending:'قيد الانتظار',confirmed:'مؤكد',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'ملغى'};let seenOrders=null,orderBusy=false;async function loadOrders(){if(orderBusy||e('panel').hidden)return;orderBusy=true;try{const r=await db.from('orders').select('*').order('created_at',{ascending:false});const list=e('orders');if(r.error){e('orderNotice').hidden=false;e('orderNotice').textContent='تعذر تحديث الطلبات';return}const ids=[...new Set(r.data.flatMap(o=>Array.isArray(o.product_ids)?o.product_ids:[]))];const pr=ids.length?await db.from('products').select('id,name,photo,price,size').in('id',ids):{data:[]};const products=new Map((pr.data||[]).map(p=>[p.id,p]));const fresh=seenOrders?r.data.filter(o=>!seenOrders.has(o.id)):[];seenOrders=new Set(r.data.map(o=>o.id));if(fresh.length){e('orderNotice').hidden=false;e('orderNotice').textContent='وصل '+fresh.length+' طلب جديد';}list.replaceChildren();if(!r.data.length)list.textContent='لا توجد طلبات حالياً';for(const o of r.data){const card=document.createElement('article');card.className='order-card';for(const value of [o.customer_name,o.phone,o.governorate,o.address,new Date(o.created_at).toLocaleString('ar-TN'),'المجموع: '+Number(o.total||0).toFixed(3)+' د.ت','رقم الطلب: '+o.id]){const p=document.createElement('p');p.textContent=value||'';card.append(p)}const phone=String(o.phone||'').trim();if(/^[0-9]{8}$/.test(phone)){const call=document.createElement('a');call.className='call';call.href='tel:+216'+phone;call.textContent='☎ الاتصال بالحريف';card.append(call)}const h=document.createElement('h4');h.textContent='المنتجات المطلوبة';card.append(h);for(const id of (o.product_ids||[])){const p=products.get(id),row=document.createElement('div');row.className='order-product';if(p?.photo){const img=document.createElement('img');img.src=p.photo;img.alt=p.name;row.append(img)}const t=document.createElement('span');t.textContent=p?p.name+' — '+Number(p.price).toFixed(3)+' د.ت (السعر الحالي) — القياس: '+(p.size||'—'):'منتج غير متاح للعرض';row.append(t);card.append(row)}const select=document.createElement('select');for(const [k,v] of Object.entries(statuses)){const opt=document.createElement('option');opt.value=k;opt.textContent=v;select.append(opt)}select.value=o.status;const b=document.createElement('button');b.textContent='حفظ الحالة';b.onclick=async()=>{b.disabled=true;const res=await db.from('orders').update({status:select.value}).eq('id',o.id);msg(res.error?'تعذر تحديث الحالة':'تم تحديث حالة الطلب');b.disabled=false};const del=document.createElement('button');del.className='delete-order';del.textContent='حذف الطلبية';del.onclick=async()=>{if(!confirm('هل تريد حذف هذه الطلبية نهائياً؟'))return;del.disabled=true;try{const res=await db.from('orders').delete().eq('id',o.id).select('id');if(res.error||!res.data?.length)throw Error('تعذر حذف الطلبية: تحقق من صلاحيات الإدارة');card.remove();msg('تم حذف الطلبية');await loadOrders()}catch(err){msg(err.message);del.disabled=false}};card.append(select,b,del);list.append(card)}}finally{orderBusy=false}}e('refreshOrders').onclick=loadOrders;setInterval(()=>{if(!document.hidden&&!e('panel').hidden&&!orderBusy){const focused=document.activeElement;if(!e('orders').contains(focused))loadOrders()}},30000);check()</script></html>
