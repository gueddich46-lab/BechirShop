><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>الأقسام</span></button><button onclick="favoriteView()"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1c-5 5 2 11 8 16 6-5 13-11 8-16z"/></svg><span>المفضلة</span></button><button onclick="cartView()"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h3l3 13h11l3-10H6"/><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/></svg><span>السلة <span id="count">0</span></span></button></nav><dialog id="basket"><h2>سلة المشتريات</h2><div id="lines"></div><form id="checkout" hidden><h3>إتمام الطلب</h3><input id="customer" required minlength="2" maxlength="100" placeholder="اسم الحريف"><input id="phone" type="tel" pattern="[0-9]{8}" required placeholder="رقم الهاتف (8 أرقام)"><select id="governorate" required><option value="">اختر الولاية</option><option>تونس</option><option>أريانة</option><option>بن عروس</option><option>منوبة</option><option>نابل</option><option>زغوان</option><option>بنزرت</option><option>باجة</option><option>جندوبة</option><option>الكاف</option><option>سليانة</option><option>سوسة</option><option>المنستير</option><option>المهدية</option><option>صفاقس</option><option>القيروان</option><option>القصرين</option><option>سيدي بوزيد</option><option>قابس</option><option>مدنين</option><option>تطاوين</option><option>قفصة</option><option>توزر</option><option>قبلي</option></select><input id="address" required minlength="5" maxlength="300" placeholder="العنوان الكامل"><p>الدفع عند الاستلام — مصاريف التوصيل تُحدد عند تأكيد الطلب.</p><button id="submitOrder">إرسال الطلب</button></form><p id="orderMsg" role="status"></p><button onclick="basket.close()">متابعة التسوق</button></dialog><dialog id="details"><div id="detailContent"></div><button class="secondary" onclick="details.close()">إغلاق</button></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient("https://xbytbewdpooyknrkqsxo.supabase.co","sb_publishable_2XntTPhT_hWXjxOL9dIQeA_KXkppU4G");let isAdmin=false;let items=[],cart=[],editing=null,favorites=JSON.parse(localStorage.getItem("shopFavorites")||"[]"),onlyFav=false;const el=id=>document.getElementById(id);function chooseCat(v){onlyFav=false;el("category").value=v;render()}function homeView(){onlyFav=false;el("category").value="الكل";el("search").value="";render();window.scrollTo({top:0,behavior:"smooth"})}function favoriteView(){onlyFav=true;el("category").value="الكل";el("search").value="";render();el("sectionTitle").scrollIntoView({behavior:"smooth"})}function render(){el("sectionTitle").textContent=onlyFav?"المفضلة":"أحدث المنتجات";document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("active",!onlyFav&&b.dataset.cat===el("category").value));el('products').replaceChildren();let filtered=items.filter(p=>(!onlyFav||favorites.includes(p.id))&&(p.name+' '+p.brand).toLowerCase().includes(el('search').value.toLowerCase())&&(el('category').value==='الكل'||p.cat===el('category').value));if(!filtered.length)el('products').textContent='لا توجد منتجات حاليًا';for(const p of filtered){let d=document.createElement('article');d.className='card';let img=document.createElement('img');img.src=p.photo;img.alt=p.name;img.onclick=()=>showDetails(p);d.append(img);let fav=document.createElement("button");fav.className="fav"+(favorites.includes(p.id)?" active":"");fav.setAttribute("aria-label","المفضلة");fav.innerHTML="<svg viewBox=\"0 0 24 24\" width=\"23\" height=\"23\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1c-5 5 2 11 8 16 6-5 13-11 8-16z\"/></svg>";fav.onclick=()=>{favorites=favorites.includes(p.id)?favorites.filter(x=>x!==p.id):[...favorites,p.id];localStorage.setItem("shopFavorites",JSON.stringify(favorites));render()};d.append(fav);for(const s of [p.name,p.brand+' · '+p.size,p.price.toFixed(3)+' د.ت']){let t=document.createElement('p');t.textContent=s;d.append(t)}let b=document.createElement('button');b.textContent=p.available?'أضف للسلة':'تم البيع';b.disabled=!p.available;b.onclick=()=>{if(!cart.includes(p.id))cart.push(p.id);el('count').textContent=cart.length};d.append(b);let more=document.createElement('button');more.className='secondary';more.textContent='التفاصيل';more.onclick=()=>showDetails(p);d.append(more);el('products').append(d)}}function showDetails(p){let d=el('detailContent');d.replaceChildren();let img=document.createElement('img');img.src=p.photo;img.alt=p.name;d.append(img);for(let v of [p.name,'الماركة: '+p.brand,'القياس: '+p.size,'التصنيف: '+p.cat,p.price.toFixed(3)+' د.ت']){let t=document.createElement('p');t.textContent=v;d.append(t)}let b=document.createElement('button');b.textContent=p.available?'أضف للسلة':'تم البيع';b.disabled=!p.available;b.onclick=()=>{if(!cart.includes(p.id))cart.push(p.id);el('count').textContent=cart.length;el('details').close()};d.append(b);el('details').showModal()}async function load(){try{const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error)throw error;items=data.map(p=>({...p,cat:p.category,price:Number(p.price)}));el('cloudStatus').textContent='';render()}catch(e){el('cloudStatus').textContent='تعذر الاتصال بالمتجر، أعد تحميل الصفحة'}}function cartView(){let lines=el('lines');lines.replaceChildren();let total=0;for(const id of cart){let p=items.find(x=>x.id===id);if(!p)continue;total+=p.price;let row=document.createElement('p');row.textContent=p.name+' — '+p.price.toFixed(3)+' د.ت ';let b=document.createElement('button');b.textContent='حذف';b.onclick=()=>{cart=cart.filter(x=>x!==id);el('count').textContent=cart.length;cartView()};row.append(b);lines.append(row)}let t=document.createElement('p');t.textContent='المجموع: '+total.toFixed(3)+' د.ت';lines.append(t);el('checkout').hidden=!cart.length;if(!el('basket').open)el('basket').showModal()}el('checkout').onsubmit=async ev=>{ev.preventDefault();if(!cart.length)return;el('submitOrder').disabled=true;el('orderMsg').textContent='جارٍ إرسال الطلب…';try{const r=await db.rpc('place_shop_order',{p_name:el('customer').value,p_phone:el('phone').value,p_governorate:el('governorate').value,p_address:el('address').value,p_ids:cart});if(r.error)throw r.error;cart=[];el('count').textContent=0;el('checkout').reset();cartView();el('orderMsg').textContent='تم إرسال طلبك، سنتصل بك لتأكيده. رقم الطلب: '+r.data}catch(err){el('orderMsg').textContent='تعذر إرسال الطلب. تحقق من البيانات وتوفر المنتجات ثم حاول مجدداً.'}finally{el('submitOrder').disabled=false}};load()</script></html>
