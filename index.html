<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بشير شوب</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6fc;color:#241735;font:16px system-ui}header{background:#5124a0;color:white;padding:24px;display:flex;justify-content:space-between;align-items:center}main{max-width:900px;margin:auto;padding:20px}h1{margin:0;font-size:24px}small{letter-spacing:2px}button,input,select{font:inherit;border:1px solid #ddd;border-radius:12px;padding:12px}button{background:#6735ba;color:white;border:0;cursor:pointer}input,select{width:100%;margin:6px 0;background:white}.hero{background:linear-gradient(135deg,#351469,#8547ce);color:white;border-radius:24px;padding:28px;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.card{background:white;border-radius:16px;overflow:hidden;padding:12px;box-shadow:0 4px 20px #38166a12}.card img{width:100%;aspect-ratio:1;object-fit:contain}.muted{color:#786d85}dialog{border:0;border-radius:20px;width:min(92%,480px);max-height:85vh}dialog::backdrop{background:#0008}footer{text-align:center;padding:20px}header{padding:18px 16px;position:sticky;top:0;z-index:5;box-shadow:0 4px 20px #30145b33}main{padding:14px}.hero{padding:20px;margin:0 0 14px;border-radius:20px}.hero h2{margin:0 0 8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:9px;min-width:0;display:flex;flex-direction:column}.card img{aspect-ratio:3/4;background:#f6f4f9;border-radius:12px;cursor:pointer}.card p{margin:5px 0;overflow-wrap:anywhere}.card p:nth-of-type(2){font-size:12px;color:#756782}.card p:nth-of-type(3){font-weight:800;color:#6735ba;font-size:18px}.card button{font-size:12px;padding:10px 5px;margin-top:5px}.card button.secondary,.secondary{background:#eee8fa;color:#5124a0}h2{font-size:20px}.muted{font-size:12px}dialog img{width:100%;max-height:45vh;object-fit:contain}dialog button{margin:5px 2px}#products:empty{display:block}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}header{padding:0;display:block;position:relative;background:#26063f}header .brand-logo{display:block;width:100%;height:auto;max-height:220px;object-fit:contain}header>button{display:block;margin:8px 12px 0 auto}header{padding-bottom:8px}</style><header><img class="brand-logo" src="logo.png" alt="BECHIR SHOP — بشير شوب"><button onclick="cartView()">🛍️ السلة <span id="count">0</span></button></header><main><div class="hero"><h2>أناقتك تبدأ هنا</h2>ملابس وأحذية مختارة بعناية</div><input id="search" placeholder="ابحث عن منتج أو ماركة" oninput="render()"><select id="category" onchange="render()"><option>الكل</option><option>ملابس</option><option>أحذية</option></select><h2>المنتجات</h2><div id="products" class="grid"></div><p class="muted">نسخة تجريبية محلية — المنتجات والطلبات غير متزامنة بعد.</p></main><footer><button onclick="admin.showModal()">⚙ إدارة المنتجات التجريبية</button></footer><dialog id="admin"><h2 id="adminTitle">إضافة منتج تجريبي</h2><form id="form"><input id="name" required placeholder="اسم المنتج"><input id="brand" placeholder="الماركة"><input id="size" placeholder="القياس"><select id="cat"><option>ملابس</option><option>أحذية</option></select><input id="price" type="number" min="0.01" step=".01" required placeholder="السعر بالدينار"><input id="photo" type="file" accept="image/*"><button>حفظ محلي</button></form><button type="button" onclick="resetEditor();admin.close()">إغلاق</button></dialog><dialog id="basket"><h2>سلة المشتريات</h2><div id="lines"></div><button onclick="basket.close()">متابعة التسوق</button></dialog><dialog id="details"><div id="detailContent"></div><button class="secondary" onclick="details.close()">إغلاق</button></dialog><script>let items=JSON.parse(localStorage.getItem('shopItems')||'[]'),cart=[],editing=null;const el=id=>document.getElementById(id);function render(){el('products').replaceChildren();let filtered=items.filter(p=>(p.name+' '+p.brand).toLowerCase().includes(el('search').value.toLowerCase())&&(el('category').value==='الكل'||p.cat===el('category').value));if(!filtered.length)el('products').textContent='لا توجد منتجات حاليًا';for(const p of filtered){let d=document.createElement('article');d.className='card';let img=document.createElement('img');img.src=p.photo;img.alt=p.name;img.onclick=()=>showDetails(p);d.append(img);for(const s of [p.name,p.brand+' · '+p.size,p.price.toFixed(2)+' د.ت']){let t=document.createElement('p');t.textContent=s;d.append(t)}let b=document.createElement('button');b.textContent='أضف للسلة';b.onclick=()=>{if(!cart.includes(p.id))cart.push(p.id);el('count').textContent=cart.length};d.append(b);let more=document.createElement('button');more.className='secondary';more.textContent='التفاصيل';more.onclick=()=>showDetails(p);d.append(more);el('products').append(d)}}function resetEditor(){editing=null;el('form').reset();el('adminTitle').textContent='إضافة منتج تجريبي'}function showDetails(p){let d=el('detailContent');d.replaceChildren();let img=document.createElement('img');img.src=p.photo;img.alt=p.name;d.append(img);for(let v of [p.name,'الماركة: '+p.brand,'القياس: '+p.size,'التصنيف: '+p.cat,p.price.toFixed(2)+' د.ت']){let t=document.createElement('p');t.textContent=v;d.append(t)}for(let [label,fn] of [['أضف للسلة',()=>{if(!cart.includes(p.id))cart.push(p.id);el('count').textContent=cart.length;el('details').close()}],['تعديل تجريبي',()=>{editing=p.id;for(let k of ['name','brand','size','cat','price'])el(k).value=p[k];el('adminTitle').textContent='تعديل المنتج';el('details').close();el('admin').showModal()}],['حذف تجريبي',()=>{if(!confirm('حذف هذا المنتج؟'))return;let next=items.filter(x=>x.id!==p.id);localStorage.setItem('shopItems',JSON.stringify(next));items=next;cart=cart.filter(x=>x!==p.id);el('count').textContent=cart.length;el('details').close();render()}]]){let b=document.createElement('button');b.textContent=label;b.onclick=fn;d.append(b)}el('details').showModal()}el('form').onsubmit=async e=>{e.preventDefault();let file=el('photo').files[0],old=items.find(x=>x.id===editing);if(!file&&!old){alert('اختر صورة المنتج');return}function save(photo){let p={id:editing??Date.now(),name:el('name').value,brand:el('brand').value,size:el('size').value,cat:el('cat').value,price:Number(el('price').value),photo};let next=old?items.map(x=>x.id===editing?p:x):[...items,p];try{localStorage.setItem('shopItems',JSON.stringify(next));items=next;render();resetEditor();el('admin').close()}catch{alert('تعذر الحفظ، اختر صورة أصغر')}}if(file){let reader=new FileReader();reader.onload=()=>save(reader.result);reader.readAsDataURL(file)}else save(old.photo)};function cartView(){let lines=el('lines');lines.replaceChildren();let total=0;for(const id of cart){let p=items.find(x=>x.id===id);if(!p)continue;total+=p.price;let row=document.createElement('p');row.textContent=p.name+' — '+p.price.toFixed(2)+' د.ت ';let b=document.createElement('button');b.textContent='حذف';b.onclick=()=>{cart=cart.filter(x=>x!==id);el('count').textContent=cart.length;cartView()};row.append(b);lines.append(row)}let t=document.createElement('p');t.textContent='المجموع: '+total.toFixed(2)+' د.ت';lines.append(t);if(!el('basket').open)el('basket').showModal()}render()</script></html>
