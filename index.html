<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بشير شوب</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f6fc;color:#241735;font:16px system-ui}header{background:#5124a0;color:white;padding:24px;display:flex;justify-content:space-between;align-items:center}main{max-width:900px;margin:auto;padding:20px}h1{margin:0;font-size:24px}small{letter-spacing:2px}button,input,select{font:inherit;border:1px solid #ddd;border-radius:12px;padding:12px}button{background:#6735ba;color:white;border:0;cursor:pointer}input,select{width:100%;margin:6px 0;background:white}.hero{background:linear-gradient(135deg,#351469,#8547ce);color:white;border-radius:24px;padding:28px;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.card{background:white;border-radius:16px;overflow:hidden;padding:12px;box-shadow:0 4px 20px #38166a12}.card img{width:100%;aspect-ratio:1;object-fit:contain}.muted{color:#786d85}dialog{border:0;border-radius:20px;width:min(92%,480px);max-height:85vh}dialog::backdrop{background:#0008}footer{text-align:center;padding:20px}</style><header><div><h1>بشير شوب</h1><small>BECHIR SHOP</small></div><button onclick="cartView()">السلة <span id="count">0</span></button></header><main><div class="hero"><h2>أناقتك تبدأ هنا</h2>ملابس وأحذية مختارة بعناية</div><input id="search" placeholder="ابحث عن منتج أو ماركة" oninput="render()"><select id="category" onchange="render()"><option>الكل</option><option>ملابس</option><option>أحذية</option></select><h2>المنتجات</h2><div id="products" class="grid"></div><p class="muted">نسخة تجريبية محلية — المنتجات والطلبات غير متزامنة بعد.</p></main><footer><button onclick="admin.showModal()">تجربة إضافة منتج</button></footer><dialog id="admin"><h2>إضافة منتج تجريبي</h2><form id="form"><input id="name" required placeholder="اسم المنتج"><input id="brand" placeholder="الماركة"><input id="size" placeholder="القياس"><select id="cat"><option>ملابس</option><option>أحذية</option></select><input id="price" type="number" min="0.01" step=".01" required placeholder="السعر بالدينار"><input id="photo" type="file" accept="image/*" required><button>حفظ محلي</button></form><button onclick="admin.close()">إغلاق</button></dialog><dialog id="basket"><h2>سلة المشتريات</h2><div id="lines"></div><button onclick="basket.close()">متابعة التسوق</button></dialog><script>let items=JSON.parse(localStorage.getItem('shopItems')||'[]'),cart=[];const el=id=>document.getElementById(id);function render(){el('products').replaceChildren();let filtered=items.filter(p=>(p.name+' '+p.brand).includes(el('search').value)&&(el('category').value==='الكل'||p.cat===el('category').value));if(!filtered.length)el('products').textContent='لا توجد منتجات حاليًا';for(const p of filtered){let d=document.createElement('article');d.className='card';let img=document.createElement('img');img.src=p.photo;d.append(img);for(const s of [p.name,p.brand+' · '+p.size,p.price.toFixed(2)+' د.ت']){let t=document.createElement('p');t.textContent=s;d.append(t)}let b=document.createElement('button');b.textContent='أضف للسلة';b.onclick=()=>{if(!cart.includes(p.id))cart.push(p.id);el('count').textContent=cart.length};d.append(b);el('products').append(d)}}el('form').onsubmit=async e=>{e.preventDefault();let file=el('photo').files[0],reader=new FileReader();reader.onload=()=>{let p={id:Date.now(),name:el('name').value,brand:el('brand').value,size:el('size').value,cat:el('cat').value,price:Number(el('price').value),photo:reader.result};try{localStorage.setItem('shopItems',JSON.stringify([...items,p]));items.push(p);render();e.target.reset();el('admin').close()}catch{alert('الصورة كبيرة جدًا، اختر صورة أصغر')}};reader.readAsDataURL(file)};function cartView(){let lines=el('lines');lines.replaceChildren();let total=0;for(const id of cart){let p=items.find(x=>x.id===id);if(!p)continue;total+=p.price;let row=document.createElement('p');row.textContent=p.name+' — '+p.price.toFixed(2)+' د.ت ';let b=document.createElement('button');b.textContent='حذف';b.onclick=()=>{cart=cart.filter(x=>x!==id);el('count').textContent=cart.length;cartView()};row.append(b);lines.append(row)}let t=document.createElement('p');t.textContent='المجموع: '+total.toFixed(2)+' د.ت';lines.append(t);if(!el('basket').open)el('basket').showModal()}render()</script></html>
